name: Build DailyTask APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build tools
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;21.4.7075529" "cmake;3.22.1"

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION_NAME=$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+['\"]([^'\"]+)['\"].*/\1/p" app/build.gradle | head -n 1)
          if [ -z "$VERSION_NAME" ]; then
            echo "Could not read versionName from app/build.gradle"
            exit 1
          fi
          echo "value=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: bash ./gradlew --no-daemon :app:assembleRelease

      - name: Get build date
        id: build_date
        run: echo "value=$(TZ=Asia/Shanghai date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || steps.app_version.outputs.value }}
          name: ${{ github.ref_type == 'tag' && format('DailyTask {0}', github.ref_name) || format('DailyTask build-{0}', steps.build_date.outputs.value) }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
